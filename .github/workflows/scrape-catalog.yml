name: Build England Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_catalog.py'
      - '.github/workflows/scrape-catalog.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape current England catalog
        run: python scripts/build_catalog.py
      - name: Upload catalog JSON
        uses: actions/upload-artifact@v4
        with:
          name: england-current-catalog
          path: catalog.json
